[project]
name = "pdf-to-text"
version = "0.1.0"
description = "A quick tool to convert PDF files to text"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdf2image",
    "Pillow",
    "pytesseract",
    "argcomplete"
]

[project.scripts]
pdf-to-text = "src.pdf_to_text:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
